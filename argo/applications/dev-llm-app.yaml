apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-inference-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yourusername/llm-gitops.git
    targetRevision: HEAD
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true